<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mini Projet 1 – BaaS Firebase</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 24px; }
    li { padding: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Livre d'or</h1>
  <p>Exemple BaaS avec Firebase Firestore</p>

  <input id="msgInput" type="text" placeholder="Votre message..." />
  <button onclick="ajouterMessage()">Envoyer</button>

  <ul id="messages"></ul>

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // TODO : remplace ces valeurs par celles de ta console Firebase
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
      projectId: "VOTRE_PROJECT_ID",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const liste = document.getElementById("messages");

    // Lecture en temps réel
    db.collection("messages")
      .orderBy("date", "desc")
      .onSnapshot((snapshot) => {
        liste.innerHTML = "";
        snapshot.forEach((doc) => {
          const li = document.createElement("li");
          li.textContent = doc.data().texte;
          liste.appendChild(li);
        });
      });

    // Écriture
    function ajouterMessage() {
      const texte = document.getElementById("msgInput").value.trim();
      if (!texte) return;
      db.collection("messages").add({ texte, date: new Date() });
      document.getElementById("msgInput").value = "";
    }
  </script>
</body>
</html>
